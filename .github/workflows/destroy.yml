name: Destroy

on:
  issues:
    types: [labeled]

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  destroy:
    name: Destroy Terraform
    if: github.event.label.name == 'destroy-approved'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Validate Issue
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          ENV=$(echo "$BODY" | grep -A2 "### Ambiente" | grep -E "^dev$" | tr -d '[:space:]')
          CONFIRM=$(echo "$BODY" | grep -A2 "### Confirmação" | grep -E "^DESTROY$" | tr -d '[:space:]')

          if [[ "$ENV" != "dev" ]]; then
            echo "Destroy de prod não é permitido via automação. Execute manualmente via CLI."
            exit 1
          fi

          if [[ "$CONFIRM" != "DESTROY" ]]; then
            echo "Confirmação inválida. O campo deve conter exatamente 'DESTROY'."
            exit 1
          fi

          echo "Validações OK — prosseguindo com destroy de dev."

      - uses: actions/checkout@v4

      - uses: SthoreH/shd-github-actions-workflows/actions/parse-config@v1.6.0
        id: config-parser
        with:
          environment: dev

      - name: Export Config
        run: |
          echo "TF_VERSION=${{ fromJSON(steps.config-parser.outputs.config)['pipe_infra_terraform-version'] }}" >> $GITHUB_ENV
          echo "TF_PATH=${{ fromJSON(steps.config-parser.outputs.config)['pipe_infra_working-path'] }}" >> $GITHUB_ENV

      - name: Destroy Terraform
        uses: SthoreH/shd-github-actions-workflows/actions/destroy-terraform@v1.6.0
        with:
          environment: dev
          working-directory: ${{ env.TF_PATH }}
          terraform-version: ${{ env.TF_VERSION }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          tf-backend-bucket: ${{ vars.TF_STATE_BUCKET }}
          tf-backend-key: ${{ github.event.repository.name }}/terraform.tfstate

      - name: Close Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const status = success ? '✅ Destroy concluído com sucesso' : '❌ Destroy falhou';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**${status}** no ambiente \`dev\`\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (success) {
              await github.rest.issues.update({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed'
              });
            }
