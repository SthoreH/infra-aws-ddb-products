name: Rollback

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  parse:
    name: Parse Issue
    if: github.event.label.name == 'rollback-approved'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.parse.outputs.environment }}
      target_tag: ${{ steps.parse.outputs.target_tag }}
    steps:
      - name: Parse Issue Body
        id: parse
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          ENV=$(echo "$BODY" | grep -A2 "### Ambiente" | grep -E "^(dev|prod)$" | tr -d '[:space:]')
          TAG=$(echo "$BODY" | grep -A2 "### Tag ou Release alvo" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]" | tr -d '[:space:]')

          if [[ -z "$ENV" || -z "$TAG" ]]; then
            echo "Não foi possível extrair ambiente ou tag do issue."
            exit 1
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "target_tag=$TAG" >> $GITHUB_OUTPUT

  rollback:
    name: Rollback Infra
    needs: parse
    uses: SthoreH/shd-github-actions-workflows/.github/workflows/cd-infra-terraform.yml@v1.6.0
    with:
      environment: ${{ needs.parse.outputs.environment }}
      ref: ${{ needs.parse.outputs.target_tag }}
    secrets: inherit

  comment:
    name: Comment on Issue
    needs: [parse, rollback]
    if: always() && needs.parse.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ needs.rollback.result }}' === 'success';
            const status = success ? '✅ Rollback aplicado com sucesso' : '❌ Rollback falhou';
            const env = '${{ needs.parse.outputs.environment }}';
            const tag = '${{ needs.parse.outputs.target_tag }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**${status}** no ambiente \`${env}\`\nTag aplicada: \`${tag}\`\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
