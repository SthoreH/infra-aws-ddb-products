name: Deploy Prod

on:
  push:
    branches: [main]
    paths:
      - "terraform-aws/**"
      - ".github/**"

permissions:
  contents: read
  id-token: write

jobs:
  cd:
    name: Deploy Infra
    uses: SthoreH/shd-github-actions-workflows/.github/workflows/cd-infra-terraform.yml@v1.6.0
    with:
      environment: prod
    secrets: inherit

  release:
    name: Release Version
    runs-on: ubuntu-latest
    needs: cd
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
